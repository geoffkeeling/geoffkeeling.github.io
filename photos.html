<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photos — Geoff Keeling</title>
  <meta name="description" content="Photos from talks, workshops and conferences — Geoff Keeling" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .back-home {
      margin-top: 1rem;
      margin-bottom: 1.5rem;
      font-size: 0.95rem;
    }
    .back-home a {
      text-decoration: none;
    }
    .photo-figure {
      margin: 1.5rem 0 2.5rem 0;
    }
    .photo-figure img {
      display: block;
      max-width: 100%;
      height: auto;
      margin: 0 auto;
    }
    .photo-figure figcaption {
      font-size: 0.85rem;
      line-height: 1.45;
      margin-top: 0.65rem;
      text-align: left;
      color: var(--body-color);
      opacity: 0.9;

    .photo-figure figcaption::before {
      content: none !important;
    }

</head>
<body id="top" class="text-justify">
  <button id="dark-mode-toggle" class="dark-mode-toggle" aria-label="Toggle dark mode">◐</button>

  <p class="back-home">
    <a href="index.html">← Geoff Keeling</a>
  </p>

  <header>

    </p>

  <main>
    <article>

        <figcaption>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const toggle = document.querySelector('#dark-mode-toggle');
      if (toggle) {

    });
